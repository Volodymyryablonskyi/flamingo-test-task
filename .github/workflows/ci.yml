name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The API and UI suites run as separate jobs so a UI flake never hides API signal,
# and so the two halves give feedback in parallel rather than one after the other.
# Neither job needs a secret: every credential in config.properties is a published
# demo credential, so this workflow is green on a fork's very first pull request.
permissions:
  contents: read

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress

jobs:
  api-tests:
    name: API (REST + GraphQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the API suite
        run: mvn $MAVEN_ARGS clean test -Dgroups=api

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-results
          path: |
            target/allure-results
            target/surefire-reports
          if-no-files-found: warn

  ui-tests:
    name: UI (DemoQA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Keyed on the pinned Playwright version, so a version bump in pom.xml
      # invalidates the cache instead of running against a stale browser build.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      - name: Install Chromium
        run: mvn $MAVEN_ARGS compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run the UI suite
        run: mvn $MAVEN_ARGS test -Dgroups=ui

      # Screenshots and traces only exist when something failed, which is exactly
      # when a reviewer needs them: the trace opens offline via `npx playwright show-trace`.
      - name: Upload results, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-results
          path: |
            target/allure-results
            target/surefire-reports
            target/screenshots
            target/traces
          if-no-files-found: warn

  report:
    name: Allure report
    needs: [api-tests, ui-tests]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Both jobs' results are merged into one report, so the published page
      # covers the whole suite rather than half of it.
      - name: Collect results from both suites
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Merge into target/allure-results
        run: |
          mkdir -p target/allure-results
          find downloaded -type d -name allure-results -exec cp -r {}/. target/allure-results/ \;

      - name: Generate the report
        run: mvn $MAVEN_ARGS allure:report

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin
      - id: deploy
        uses: actions/deploy-pages@v4
