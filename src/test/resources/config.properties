# ---------------------------------------------------------------------------
# Committed defaults. Complete on purpose: a cold clone runs green with no
# secrets, no accounts and no local setup.
#
# Every key is overridable without touching code. ConfigLoader resolves:
#   1. -Dapi.base.url=...   system property   (ad-hoc local override)
#   2. API_BASE_URL         environment var   (CI override)
#   3. this file            committed default
# The environment-variable name is the key upper-cased with dots as underscores.
# ---------------------------------------------------------------------------

# ===== REST: Restful Booker =====
api.base.url            = https://restful-booker.herokuapp.com
# Public demo credentials published in the Restful Booker docs - not a secret.
api.auth.username       = admin
api.auth.password       = password123
api.timeout.ms          = 30000
# Transport-level retry for 5xx / 429 / connection failures only (never assertions).
api.retry.max.attempts  = 3
api.retry.backoff.ms    = 500

# ===== GraphQL =====
# Rick and Morty is the committed default: public, no token, and it satisfies every
# GraphQL requirement in the brief. Point graphql.url at a Hygraph project (or any
# other schema) to switch - the client takes the endpoint as pure configuration.
graphql.url             = https://rickandmortyapi.com/graphql

# ===== UI: DemoQA =====
ui.base.url             = https://demoqa.com
ui.headless             = true
ui.timeout.ms           = 15000
# Slows every Playwright action down by N ms - useful when watching a headed run.
ui.slowmo.ms            = 0
ui.viewport.width       = 1920
ui.viewport.height      = 1080
ui.trace.enabled        = true

# ===== Health checks =====
# If a system under test is unreachable the suite is SKIPPED with a reason rather
# than failed - the brief explicitly sanctions this for public demo services.
health.check.enabled    = true
health.timeout.ms       = 10000
