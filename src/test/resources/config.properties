# Committed defaults - complete on purpose, so a cold clone runs green with no setup.
# Overridable as -Dapi.base.url=... or API_BASE_URL=... (key upper-cased, dots to underscores).

# REST: Restful Booker
api.base.url            = https://restful-booker.herokuapp.com
# Public demo credentials from the Restful Booker docs - not a secret.
api.auth.username       = admin
api.auth.password       = password123
api.timeout.ms          = 30000
api.retry.max.attempts  = 3
api.retry.backoff.ms    = 500

# GraphQL. Point graphql.url at any schema to switch; the client takes it as configuration.
graphql.url             = https://rickandmortyapi.com/graphql

# UI: DemoQA
ui.base.url             = https://demoqa.com
ui.headless             = true
ui.timeout.ms           = 15000
ui.slowmo.ms            = 0
ui.viewport.width       = 1920
ui.viewport.height      = 1080
ui.trace.enabled        = true

# An unreachable system skips its tests with a reason rather than failing them.
health.check.enabled    = true
health.timeout.ms       = 10000
